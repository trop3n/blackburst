# Reachable directly at http://<docker-host>:8081 and through Nginx Proxy Manager on the
# shared "proxy" network. 8080 is the previz viewer, so this takes 8081.
#
# The two VITE_SUPABASE_* values come from an .env file beside this one on the host — not
# from git. Without them the image builds in local mode.
services:
  samc-av-studio:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: samc-av-studio
    restart: unless-stopped
    ports:
      - "8081:80"
    # A directory rather than a single file: Docker creates an empty one if the
    # host path is missing, and an empty directory is a wildcard include that
    # matches nothing. Mounting a file that did not exist would instead create a
    # directory with that name and break the config. Contents are gitignored —
    # the snippet carries an Access service token.
    volumes:
      - ./nginx-snippets:/etc/nginx/snippets:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
