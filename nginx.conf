server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # These are the headers vercel.json used to send; nothing applies them for us once the
    # app is served from here. Two directives are load-bearing and non-obvious: font-src
    # needs data: because @fontsource inlines a dozen subset faces as data:font/woff URIs,
    # and connect-src must keep the supabase.co origins or accounts mode is blocked
    # outright — REST and realtime both.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    # Vite fingerprints everything under /assets/, so those can be held forever; index.html
    # must not be, or a deploy stays invisible until a hard refresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
