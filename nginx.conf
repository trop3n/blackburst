# Cache-Control differs per path, but an add_header inside a location block replaces every
# header inherited from the server — so the value is computed here and all the add_headers
# stay at server level. Vite fingerprints everything under /assets/, so those can be held
# forever; index.html must not be, or a deploy stays invisible until a hard refresh.
map $uri $cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The app's security headers. Nothing else applies them — this file is the only place
    # they exist. Two directives are load-bearing and non-obvious: font-src
    # needs data: because @fontsource inlines a dozen subset faces as data:font/woff URIs,
    # and connect-src must keep the supabase.co origins or accounts mode is blocked
    # outright — REST and realtime both.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Network app's export is reachable at /api/network/export.json when the
    # proxy snippet is mounted (see nginx-network-proxy.conf.example). Without it
    # the feature is simply off, and this says so: the SPA fallback above would
    # otherwise hand back index.html with a 200, and a caller asking for JSON
    # cannot tell that apart from a working endpoint. Studio treats 404 as
    # "not configured" and renders nothing, the same way an unset
    # VITE_SUPABASE_URL means local mode rather than a broken app.
    #
    # The snippet's `location = /api/network/export.json` is an exact match, so it
    # wins over this prefix whenever it is present — nginx takes the longest match,
    # not the first.
    location /api/ {
        return 404;
    }

    # Empty when nothing is mounted, which is not an error for a wildcard include.
    # The snippet carries an Access service token, so it is mounted at runtime and
    # never built into the image.
    include /etc/nginx/snippets/*.conf;
}
